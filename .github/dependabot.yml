version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine noise, so the two of you review a batch rather
      # than a stream.
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Major versions are deliberate work, not a weekly PR: they change APIs
      # (ESLint, ioredis, Vite plugins) or must move with the runtime
      # (@types/node tracks the Node version in .nvmrc and CI). Raise a ticket
      # and do one at a time.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Drizzle is pre-1.0, where a "minor" bump is a breaking release. It
      # builds every migration and the RLS policies gate 2 checks, so it moves
      # only as a deliberate, tested upgrade - never inside a routine group.
      - dependency-name: 'drizzle-orm'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'drizzle-kit'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Majors ARE allowed here. Actions are retired by GitHub on its own
    # schedule (the Node 20 runtime deprecation), and a major bump of a
    # first-party action is the usual fix.

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/worker
      - /apps/web
    schedule:
      interval: monthly
    ignore:
      # The Node major in the images must match .nvmrc, CI's NODE_VERSION and
      # @types/node. Changing it is one deliberate change across all four, not
      # three Dependabot PRs that move the images alone.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      # nginx serves static files only; minor and patch releases are taken,
      # majors are reviewed by hand.
      - dependency-name: nginx
        update-types: ['version-update:semver-major']
