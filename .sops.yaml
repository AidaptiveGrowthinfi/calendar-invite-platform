# SOPS and age. ADR 0049.
#
# Encrypted secrets ARE committed. The age private key is held on the VPS and
# in the team's password manager, never in the repository. Decryption happens
# at deploy time, which keeps a hosted dependency and a network call off the
# boot path.
#
# What this defends against, stated plainly because ADR 0033 omitted it:
#   - Secret loss through personnel change or lost hosting access. This is the
#     failure that actually occurred in v1 (W23). Encrypted secrets are in git
#     history; the age key is in two places by policy.
#   - Accidental disclosure. A secret pasted into a log or an issue is
#     ciphertext.
#   - Repository compromise alone. Ciphertext without the age key is not useful.
#
# What it does NOT defend against: host compromise. An attacker with root on
# the VPS reads the decrypted values out of the running process. Reducing that
# needs a managed KMS with per-operation authorisation and is out of scope.
#
# Add each recipient's PUBLIC age key below. Generate one with:
#   age-keygen -o ~/.config/sops/age/keys.txt
creation_rules:
  - path_regex: secrets/.*\.enc\.yaml$
    key_groups:
      - age:
          # TODO(P): replace with the real recipients before the first real
          # secret is encrypted. Two people plus the VPS key.
          - age1placeholder0000000000000000000000000000000000000000000000000
