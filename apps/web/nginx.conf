server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The dashboard is a single-page application (ADR 0056): every unknown path
  # is a client route, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The public pages - hosted RSVP, unsubscribe, one-click unsubscribe - are
  # NOT served here. ADR 0053, carried forward by 0056, keeps them rendered by
  # the API: they must work without JavaScript and answer a mail client's
  # automated unsubscribe correctly.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
